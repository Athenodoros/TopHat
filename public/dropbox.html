<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TopHat - Dropbox</title>
    </head>
    <!--
        Where the Dropbox sign-in popup lands. It exists only so that the popup comes back to a
        same-origin URL which is served as it stands, without a redirect and without booting the
        app: TopHat reads the authorisation code out of the popup and closes it from the tab that
        opened it. There is deliberately no script here.
    -->
    <body>
        <p>Signing in to Dropbox… you can close this window if it does not close itself.</p>
    </body>
</html>
