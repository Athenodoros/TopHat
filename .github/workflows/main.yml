# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
    # Triggers the workflow on push or pull request events but only for the main branch
    push:
        branches: [main]
    pull_request:
        branches: [main]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    # This workflow contains a single job called "build"
    build:
        # The type of runner that the job will run on
        runs-on: ubuntu-latest

        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            - name: Checkout code to action runner
              uses: actions/checkout@v4

            - name: Add node to environment
              uses: actions/setup-node@v4
              with:
                  node-version: "21"
                  # Yarn's download cache, keyed on yarn.lock: a changed lockfile, such as a new
                  # personal-storage-wrapper commit, misses it and installs afresh
                  cache: yarn

            - name: Move into the project directory
              run: |
                  cd $GITHUB_WORKSPACE

            - name: Install dependencies
              run: |
                  yarn install --frozen-lockfile

            - name: Check formatting
              run: |
                  yarn format:check

            - name: Run tests
              run: |
                  yarn test --run

            - name: Build from source
              run: |
                  yarn build

            # Pull requests are checked but never deployed: only main, pushed or run by hand, goes live
            - name: Deploy to gh-pages branch
              if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
              run: |
                  cd dist
                  git init -b main
                  git add -A
                  git config user.name 'GH Action'
                  git config user.email 'Athenodoros@noreply.github.com'
                  git commit -m "Package resources for gh-pages"
                  git push -f https://Athenodoros:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} main:gh-pages
